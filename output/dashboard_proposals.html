<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gradient {
            background: linear-gradient(135deg, #a78bfa 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow {
            box-shadow: 0 0 50px -10px rgba(139, 92, 246, 0.15);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-200 h-full flex flex-col bg-slate-950 selection:bg-purple-500 selection:text-white overflow-y-auto">
    <!-- Background glows -->
    <div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-purple-900/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-blue-900/10 rounded-full blur-[150px] pointer-events-none -z-10"></div>

    <div class="max-w-[1600px] mx-auto w-full p-4 lg:p-8 flex-grow flex flex-col gap-6">
        <!-- Header -->

            <div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 text-xs font-semibold uppercase tracking-wider rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 font-outfit">Catálogo de Propuestas</span>
                    <span class="text-xs text-slate-500 font-medium">30 Diseños Disponibles</span>
                </div>
                <h1 class="text-3xl lg:text-4xl font-extrabold font-outfit text-white tracking-tight mt-2">
                    <span class="text-gradient">GestObra BI</span> Proposals Catalog
                </h1>
                <p class="text-slate-400 text-sm mt-1">Explora, interactúa y selecciona los gráficos que formarán parte de tu dashboard personalizado.</p>
            </div>
            <div class="glass px-5 py-3 rounded-2xl flex items-center gap-4 self-stretch sm:self-auto justify-between">
                <div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Seleccionados</div>
                    <div class="text-xl font-extrabold font-outfit text-purple-400"><span id="selected-count">0</span> / 30</div>
                </div>
                <button onclick="exportSelection()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all font-outfit">
                    Copiar Lista Seleccionada
                </button>
            </div>
        </header>

        <!-- Main Layout Split -->
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Navigation -->
            <aside class="w-full lg:w-64 shrink-0 flex flex-col gap-3">
                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase px-2">Categorías</div>
                <button onclick="filterCategory('all')" id="cat-btn-all" class="w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all glass bg-purple-500/10 text-purple-400 border border-purple-500/20 font-outfit">
                    Todos los Gráficos (30)
                </button>
                <button onclick="filterCategory('presencia')" id="cat-btn-presencia" class="w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/30 font-outfit">
                    1. Control Horario (7)
                </button>
                <button onclick="filterCategory('obras')" id="cat-btn-obras" class="w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/30 font-outfit">
                    2. Productividad y Obras (8)
                </button>
                <button onclick="filterCategory('whatsapp')" id="cat-btn-whatsapp" class="w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/30 font-outfit">
                    3. Interacción WhatsApp (7)
                </button>
                <button onclick="filterCategory('recursos')" id="cat-btn-recursos" class="w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-900/30 font-outfit">
                    4. Recursos y Logística (8)
                </button>
            </aside>

            <!-- Cards Catalog Grid -->
            <div class="flex-grow flex flex-col gap-6" id="catalog-container">
                <!-- Proposal Cards will be dynamically injected here -->
            </div>
        </div>
    </div>

        // Category Filter
        function filterCategory(catId) {
            const container = document.getElementById('catalog-container');
            const cards = container.querySelectorAll('.proposal-card');
            
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                if (catId === 'all' || cardCat === catId) {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                } else {
                    card.classList.add('hidden');
                    card.classList.remove('flex');
                }
            });

            // Highlight active sidebar item
            const categories = ['all', 'presencia', 'obras', 'whatsapp', 'recursos'];
            categories.forEach(c => {
                const btn = document.getElementById('cat-btn-' + c);
                btn.classList.remove('bg-purple-500/10', 'text-purple-400', 'border', 'border-purple-500/20');
                btn.classList.add('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-900/30');
            });

            const activeBtn = document.getElementById('cat-btn-' + catId);
            activeBtn.classList.remove('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-900/30');
            activeBtn.classList.add('bg-purple-500/10', 'text-purple-400', 'border', 'border-purple-500/20');
        }

        // Selection / Checklist
        function toggleSelection(id) {
            const card = document.getElementById('card-' + id);
            const selectBtn = document.getElementById('btn-select-' + id);
            
            if (selectedCharts.has(id)) {
                selectedCharts.delete(id);
                card.classList.remove('border-purple-500/50', 'bg-purple-500/5');
                card.classList.add('border-slate-800/60');
                selectBtn.innerText = 'Seleccionar Gráfico';
                selectBtn.classList.remove('bg-purple-600', 'text-white');
                selectBtn.classList.add('bg-slate-800', 'text-slate-300', 'hover:bg-slate-700');
            } else {
                selectedCharts.add(id);
                card.classList.add('border-purple-500/50', 'bg-purple-500/5');
                card.classList.remove('border-slate-800/60');
                selectBtn.innerText = '✓ Seleccionado';
                selectBtn.classList.add('bg-purple-600', 'text-white');
                selectBtn.classList.remove('bg-slate-800', 'text-slate-300', 'hover:bg-slate-700');
            }

            document.getElementById('selected-count').innerText = selectedCharts.size;
        }

            let exportText = "PROYECTO BI GESTOBRA: LISTA DE GRÁFICOS SELECCIONADOS PARA DESARROLLAR\\n\\n";
            chartProposals.forEach(p => {
                if (selectedCharts.has(p.id)) {
                    exportText += `- ${p.title}\\n  Tipo: ${p.type}\\n  Objetivo: ${p.objective}\\n  Métricas: ${p.metrics}\\n\\n`;
                }
            });

            navigator.clipboard.writeText(exportText).then(() => {
                alert("✓ ¡Lista de selección copiada al portapapeles! Puedes pegarla en un documento o chat.");

                    return;
                }

                const ctx = document.getElementById('canvas-' + p.id).getContext('2d');
                
                if (p.chartType === 'pie_toggleable') {
                    // Initialize Proposal #2 with first config (operarios)
                    const opData = p.chartData.operarios;
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: opData.labels,
                            datasets: [{
                                data: opData.values,
                                backgroundColor: [
                                    'rgba(139, 92, 246, 0.7)',
                                    'rgba(59, 130, 246, 0.7)',
                                    'rgba(16, 185, 129, 0.7)',
                                    'rgba(245, 158, 11, 0.7)',
                                    'rgba(236, 72, 153, 0.7)'
                                ],
                                borderColor: 'rgba(15, 23, 42, 0.9)',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 9 } } }
                            }
                        }
                    });
                } else if (p.chartType === 'gauge') {
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: 'doughnut',
                        data: p.chartData,
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            aspectRatio: 2,
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: false }
                            }
                        }
                    });
                } else if (p.chartType === 'pareto') {
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: p.chartData.labels,
                            datasets: [
                                {
                                    label: 'Horas Imputadas',
                                    data: p.chartData.hours,
                                    backgroundColor: 'rgba(99, 102, 241, 0.65)',
                                    borderColor: 'rgba(99, 102, 241, 1)',
                                    borderWidth: 1.5,
                                    borderRadius: 4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: '% Acumulado',
                                    type: 'line',
                                    data: p.chartData.pct,
                                    borderColor: 'rgba(236, 72, 153, 1)',
                                    backgroundColor: 'transparent',
                                    borderWidth: 2,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { type: 'linear', display: true, position: 'left', ticks: { color: '#64748b' } },
                                y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#64748b' } }
                            },
                            plugins: {
                                legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 9 } } }
                            }
                        }
                    });
                } else if (p.chartType === 'bar_horizontal') {
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: p.chartData.labels,
                            datasets: [{
                                label: 'Mensajes / Audios',
                                data: p.chartData.values,
                                backgroundColor: 'rgba(16, 185, 129, 0.65)',
                                borderColor: 'rgba(16, 185, 129, 1)',
                                borderWidth: 1.5,
                                borderRadius: 4
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                x: { ticks: { color: '#64748b' } },
                                y: { ticks: { color: '#64748b' } }
                            }
                        }
                    });
                } else if (p.chartType === 'bar_horizontal_pct') {
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: p.chartData.labels,
                            datasets: [{
                                label: 'Porcentaje de Uso (%)',
                                data: p.chartData.values,
                                backgroundColor: 'rgba(245, 158, 11, 0.65)',
                                borderColor: 'rgba(245, 158, 11, 1)',
                                borderWidth: 1.5,
                                borderRadius: 4
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                x: { max: 100, ticks: { color: '#64748b' } },
                                y: { ticks: { color: '#64748b' } }
                            }
                        }
                    });
                } else {
                    // Default Chart initialization
                    chartInstances['chart-' + p.id] = new Chart(ctx, {
                        type: p.chartType,
                        data: p.chartData,
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { 
                                    position: 'bottom', 
                                    labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 9 } } 
                                }
                            },
                            scales: p.chartType !== 'doughnut' && p.chartType !== 'pie' && p.chartType !== 'radar' ? {
                                x: { ticks: { color: '#64748b', font: { family: 'Plus Jakarta Sans', size: 8 } } },
                                y: { ticks: { color: '#64748b', font: { family: 'Plus Jakarta Sans', size: 8 } } }
                            } : undefined
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
